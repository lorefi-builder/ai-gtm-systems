<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpecOps — Project Assessment Agent</title>

  <!-- Fonts: clean grotesk sans (Inter) for everything; mono for code/ids. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- Tailwind (Play CDN) — matches the portfolio's CDN pattern; used lightly -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for the dashboard -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- marked for rendering the draft-spec markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar: Slack workspace feel, deep navy -->
    <aside class="sidebar">
      <div class="workspace">
        <div class="ws-name">SpecOps</div>
        <div class="ws-sub">Project Assessment Agent</div>
      </div>

      <nav class="chan-group" id="nav">
        <div class="grp-label">Channels</div>
        <button class="chan-item active" data-tab="spec">
          <span class="hash">#</span> spec-channel
        </button>
        <button class="chan-item" data-tab="review">
          <span class="hash">#</span> spec-review
          <span class="badge-dot" id="badge-review" style="display:none">0</span>
        </button>
        <button class="chan-item" data-tab="deal">
          <span class="hash">#</span> deal-tracking
          <span class="badge-dot" id="badge-deal" style="display:none">0</span>
        </button>

        <div class="grp-label" style="margin-top:14px">Analytics</div>
        <button class="chan-item" data-tab="dashboard">
          <span class="hash">📊</span> Dashboard
        </button>
        <button class="chan-item" data-tab="di">
          <span class="hash">🛰</span> Demand Intelligence
        </button>
      </nav>

      <div class="sidebar-foot">
        Warehouse = single source of truth.<br />Slack · UI · CRM are spokes.
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="topbar">
        <span class="t-hash" id="bar-hash">#</span>
        <span class="t-title" id="bar-title">spec-channel</span>
        <span class="t-desc" id="bar-desc">Run <code>/spec</code> on a discovery transcript</span>
        <span class="spacer"></span>
      </div>

      <div class="err-banner" id="err-banner">
        <span id="err-text"></span>
        <button class="x" onclick="document.getElementById('err-banner').classList.remove('show')">✕</button>
      </div>

      <!-- TAB 1: Spec channel -->
      <section class="pane active" id="pane-spec">
        <div class="channel-pane">
          <div class="msg-list" id="spec-list"></div>
          <div class="composer">
            <div class="cmd-row">
              <span class="cmd-chip">/spec</span>
              <select id="transcript-select"></select>
              <span class="as-user">posting as <code>U_DEMO</code></span>
            </div>
            <div class="composer-box">
              <div class="composer-preview" id="composer-preview"></div>
              <button class="run-btn" id="run-spec">▶ Run /spec</button>
            </div>
          </div>
        </div>
      </section>

      <!-- TAB 2: Review channel -->
      <section class="pane" id="pane-review">
        <div class="channel-pane">
          <div class="msg-list" id="review-list"></div>
        </div>
      </section>

      <!-- TAB 3: Deal-tracking channel -->
      <section class="pane" id="pane-deal">
        <div class="channel-pane">
          <div class="msg-list" id="deal-list"></div>
        </div>
      </section>

      <!-- TAB 4: Dashboard -->
      <section class="pane" id="pane-dashboard">
        <div class="dash" id="dash-root"></div>
      </section>

      <!-- TAB 5: Demand Intelligence (reads the cached /dashboard-data response) -->
      <section class="pane" id="pane-di">
        <div class="dash" id="di-root"></div>
      </section>
    </main>
  </div>

  <script src="transcripts.js"></script>
  <script src="static-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
